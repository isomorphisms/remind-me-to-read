name: Android tests and protected signed APKs
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 pinned 2026-10-21
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a
        with:
          gradle-version: '8.9'
      - name: Install Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(command -v sdkmanager || find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0"
      - name: Test all plain JVM logic and compile debug variant
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug
      - name: Host-only signer continuity adversarial controls
        run: python3 -m unittest discover -s ci -p 'test_*.py' -v
      # No ephemeral debug-key artifact is published. A green test is not an upgrade proof.

  sign:
    # Secret use limited to protected source branches, never fork pull requests.
    if: github.event_name == 'push' && github.repository == 'isomorphisms/remind-me-to-read' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/feature/reading-tracker-mvp')
    needs: tests
    environment: protected-dev-signing
    runs-on: ubuntu-latest
    env:
      RMR_DEV_KEYSTORE_B64: ${{ secrets.RMR_DEV_KEYSTORE_B64 }}
      RMR_DEV_KEYSTORE_PASSWORD: ${{ secrets.RMR_DEV_KEYSTORE_PASSWORD }}
      RMR_DEV_KEY_ALIAS: ${{ secrets.RMR_DEV_KEY_ALIAS }}
      RMR_DEV_KEY_PASSWORD: ${{ secrets.RMR_DEV_KEY_PASSWORD }}
      RMR_DEV_CERT_SHA256: ${{ secrets.RMR_DEV_CERT_SHA256 }}
      RMR_DEV_KEYSTORE_FILE: /tmp/rmr-stable.p12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a
        with:
          gradle-version: '8.9'
      - name: Install Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(command -v sdkmanager || find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0"
      - name: Require protected development signing material
        shell: bash
        run: |
          set -euo pipefail
          test -n "$RMR_DEV_KEYSTORE_B64"
          test -n "$RMR_DEV_KEYSTORE_PASSWORD"
          test -n "$RMR_DEV_KEY_ALIAS"
          test -n "$RMR_DEV_KEY_PASSWORD"
          test -n "$RMR_DEV_CERT_SHA256"
          umask 077
          printf '%s' "$RMR_DEV_KEYSTORE_B64" | base64 --decode > "$RMR_DEV_KEYSTORE_FILE"
          test -s "$RMR_DEV_KEYSTORE_FILE"
      - name: Build both ABIs with the protected persistent signer
        run: gradle --no-daemon :app:assembleStableDev
      - name: Independently check both APK certificate identities
        shell: bash
        run: bash ci/verify-signer.sh app/build/outputs/apk/stableDev signing-receipt.txt
      # The independent AI-CI registry is authoritative for finished APKs.
      # This intentionally fails until the protected signer fingerprint is
      # registered for this package and the action is repinned to that commit.
      - name: AI-CI verify C67 APK signer
        uses: isomorphisms/ai-ci/android-signing@837d0a214c82c7be01cd25d5c114ee8057025f5c
        with:
          apk: app/build/outputs/apk/stableDev/app-arm64-v8a-stableDev.apk
          lane: test
      - name: AI-CI verify A1 APK signer
        uses: isomorphisms/ai-ci/android-signing@837d0a214c82c7be01cd25d5c114ee8057025f5c
        with:
          apk: app/build/outputs/apk/stableDev/app-armeabi-v7a-stableDev.apk
          lane: test
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: remind-me-to-read-stable-dev-apks
          path: |
            app/build/outputs/apk/stableDev/*-stableDev.apk
            signing-receipt.txt
          if-no-files-found: error
      - name: Delete transient decrypted key material
        if: always()
        shell: bash
        run: rm -f "$RMR_DEV_KEYSTORE_FILE"
