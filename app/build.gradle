plugins { id 'com.android.application' }

android {
    namespace 'org.isomorphisms.remindmetoread'
    compileSdk 35

    defaultConfig {
        applicationId 'org.isomorphisms.remindmetoread'
        minSdk 26
        targetSdk 35
        versionCode 3
        versionName '0.3.1'
    }

    splits {
        abi {
            enable true
            reset()
            include 'armeabi-v7a', 'arm64-v8a'
            universalApk false
        }
    }

    // Protected long-lived development signer. Missing credentials cannot silently
    // turn a stableDev build into a runner-generated debug-key APK.
    signingConfigs {
        stableDev {
            storeFile file(System.getenv('RMR_DEV_KEYSTORE_FILE') ?: 'UNCONFIGURED_STABLE_DEV_SIGNER')
            storePassword System.getenv('RMR_DEV_KEYSTORE_PASSWORD') ?: ''
            keyAlias System.getenv('RMR_DEV_KEY_ALIAS') ?: 'UNCONFIGURED'
            keyPassword System.getenv('RMR_DEV_KEY_PASSWORD') ?: ''
            storeType 'pkcs12'
        }
    }

    buildTypes {
        debug {
            // Consumer ProGuard rules from ML Kit are applied automatically.
            minifyEnabled true
            shrinkResources true
        }
        stableDev {
            initWith debug
            matchingFallbacks = ['debug']
            signingConfig signingConfigs.stableDev
            // This is a development APK: retain run-as for controlled data rescue.
            debuggable true
        }
    }

    testOptions {
        unitTests {
            includeAndroidResources = true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // ML Kit and AndroidX pull different historical Kotlin stdlib modules;
    // align all variants to the same release to avoid duplicate classes.
    implementation platform('org.jetbrains.kotlin:kotlin-bom:1.8.22')
    constraints {
        implementation('org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22')
        implementation('org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22')
        implementation('org.jetbrains.kotlin:kotlin-stdlib:1.8.22')
    }
    implementation 'androidx.documentfile:documentfile:1.0.1'
    implementation 'androidx.core:core:1.13.1'
    // Bundled Latin OCR: offline book-spine recognition, no image upload.
    implementation 'com.google.mlkit:text-recognition:16.0.1'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.14.1'
    testImplementation 'org.json:json:20240303'
}
