plugins { id 'com.android.application' }

android {
    namespace 'org.isomorphisms.remindmetoread'
    compileSdk 35

    defaultConfig {
        applicationId 'org.isomorphisms.remindmetoread'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '0.1.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
}
